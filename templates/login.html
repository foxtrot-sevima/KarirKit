<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masuk | KarirLink</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo/karirlink-mark.svg" />
<link rel="stylesheet" href="../dist/output.css" />
</head>
<body class="flex min-h-screen flex-col bg-shell font-sans text-slate-800 antialiased">

<main class="flex flex-1 items-center justify-center px-0 py-8 sm:px-6 sm:py-10">
  <div class="w-full max-w-[480px]">
    <div class="border-0 bg-transparent p-6 shadow-none sm:rounded-card sm:border sm:border-border/70 sm:bg-surface sm:p-10 sm:shadow-card">
      <a href="../index.html" class="mb-8 flex justify-center">
        <img src="../assets/logo/karirlink-logo.svg" alt="KarirLink" class="h-8 w-auto" />
      </a>

      <div class="mb-8 text-center">
        <h1 class="font-display text-2xl font-bold text-slate-900">Masuk ke KarirLink</h1>
        <p class="mt-1.5 text-sm text-slate-500">Kelola tracer study, lowongan, dan mitra karier dalam satu dashboard.</p>
      </div>

      <form class="space-y-5" data-demo-form>
        <div>
          <label for="loginEmail" class="form-label">Alamat Email</label>
          <input id="loginEmail" type="email" required autocomplete="email" class="input" placeholder="nama@kampus.ac.id" />
        </div>

        <div>
          <div class="mb-1.5 flex items-center justify-between">
            <label for="loginPassword" class="form-label mb-0">Kata Sandi</label>
            <a href="#" class="text-xs font-medium text-primary-600 hover:text-primary-700">Lupa kata sandi?</a>
          </div>
          <div class="relative">
            <input id="loginPassword" type="password" required autocomplete="current-password" class="input pr-10" placeholder="Masukkan kata sandi" data-password-input />
            <button type="button" class="absolute inset-y-0 right-0 flex w-10 items-center justify-center text-fg-subtle transition-colors hover:text-neutral-600" data-password-toggle aria-label="Tampilkan kata sandi">
              <i class="kk kk-eye h-4 w-4"></i>
            </button>
          </div>
        </div>

        <label class="flex w-fit cursor-pointer items-center gap-2 text-sm text-slate-600">
          <input type="checkbox" class="form-check" checked />
          Ingat saya selama 30 hari
        </label>

        <button type="submit" class="btn-primary btn-lg w-full">Masuk</button>
      </form>

      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-border"></div>
        </div>
        <div class="relative flex justify-center">
          <span class="bg-surface px-3 text-xs text-fg-subtle">atau lanjutkan dengan</span>
        </div>
      </div>

      <div class="space-y-3">
        <button type="button" class="btn-outline btn-md w-full">
          <svg class="h-4 w-4" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
          </svg>
          Lanjutkan dengan Google
        </button>
        <button type="button" class="btn-outline btn-md w-full">
          <svg class="h-4 w-4" viewBox="0 0 23 23" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="1" y="1" width="10" height="10" fill="#F35325"/>
            <rect x="12" y="1" width="10" height="10" fill="#81BC06"/>
            <rect x="1" y="12" width="10" height="10" fill="#05A6F0"/>
            <rect x="12" y="12" width="10" height="10" fill="#FFBA08"/>
          </svg>
          Lanjutkan dengan Microsoft
        </button>
      </div>
    </div>

    <p class="mt-6 text-center text-sm text-slate-500">
      Belum punya akun?
      <a href="register.html" class="font-semibold text-primary-600 hover:text-primary-700">Daftar sekarang</a>
    </p>
  </div>
</main>

<footer class="pb-6 text-center text-xs text-fg-subtle">
  &copy; <span class="js-current-year">2026</span> SEVIMA. All Rights Reserved.
</footer>

<script>
  // Password visibility toggle.
  document.querySelectorAll('[data-password-toggle]').forEach((btn) => {
    const icon = btn.querySelector('.kk');
    btn.addEventListener('click', () => {
      const input = btn.previousElementSibling;
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      icon.classList.toggle('kk-eye', showing);
      icon.classList.toggle('kk-eye-slash', !showing);
      btn.setAttribute('aria-label', showing ? 'Tampilkan kata sandi' : 'Sembunyikan kata sandi');
    });
  });

  // Demo form — no backend behind this template, just stop the page reload.
  document.querySelectorAll('[data-demo-form]').forEach((form) => {
    form.addEventListener('submit', (e) => e.preventDefault());
  });

  document.querySelectorAll('.js-current-year').forEach((el) => {
    el.textContent = new Date().getFullYear();
  });
</script>
</body>
</html>
