<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta name="robots" content="noindex, nofollow" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="KarirKit" />
<meta property="og:title" content="Perusahaan | Portal Karir KarirLink" />
<meta property="og:description" content="Jelajahi perusahaan yang membuka lowongan di Portal Karir KarirLink, lalu lihat lowongan mereka." />
<meta property="og:url" content="https://karirkit.vercel.app/templates/portal-karir/perusahaan.html" />

<meta name="twitter:card" content="summary_large_image" />

</head>
<body class="flex min-h-screen flex-col bg-shell font-sans text-slate-800 antialiased">

<!-- ============================= NAVBAR ============================= -->
<div data-shell="nav" data-page="company"></div>

<main class="flex-1">

  <div data-shell="band">
    <h1 class="font-display text-2xl font-bold sm:text-3xl">Perusahaan</h1>
    <p id="lead" class="mt-1 text-sm text-white/80">Perusahaan mitra KarirLink.</p>
    <div class="mt-5 w-full sm:max-w-md">
      <label for="fQ" class="sr-only">Cari perusahaan</label>
      <div class="relative">
        <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><i class="kk kk-magnifying-glass h-4 w-4" aria-hidden="true"></i></span>
        <input id="fQ" type="search" class="input pl-9 lg:h-10 lg:rounded-full" placeholder="Cari nama, bidang, atau kota" autocomplete="off" />
      </div>
    </div>
    <div id="fieldTabs" class="mt-4 flex min-w-0 gap-2 overflow-x-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden -mx-4 w-[calc(100%+2rem)] px-4 pb-1 sm:mx-0 sm:w-full sm:px-0 sm:[mask-image:linear-gradient(to_right,#000_calc(100%-3rem),transparent)]" role="radiogroup" aria-label="Filter bidang usaha"></div>
  </div>

  <div class="mx-auto w-full max-w-7xl px-4 pb-8 pt-6 sm:px-6">
    <div id="list" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3" aria-live="polite"><div class="h-28 animate-pulse rounded-2xl bg-neutral-100"></div><div class="h-28 animate-pulse rounded-2xl bg-neutral-100"></div><div class="h-28 animate-pulse rounded-2xl bg-neutral-100"></div><div class="h-28 animate-pulse rounded-2xl bg-neutral-100"></div><div class="h-28 animate-pulse rounded-2xl bg-neutral-100"></div><div class="h-28 animate-pulse rounded-2xl bg-neutral-100"></div></div>
    <div id="pager" class="mt-6"></div>
  </div>
</main>

<div data-shell="footer"></div>

<script src="../../assets/js/ui.js"></script>
<script src="../../assets/js/pagination.js"></script>
<script src="shell.js"></script>
<script src="portal.js"></script>
<script>
  /* Daftar perusahaan. Data lewat PK.api (listCompanies); kartu membuka profil perusahaan (perusahaan-detail.html). Tanpa angka atau posisi yang berubah-ubah di daftar. */
  (function () {
    var PK = window.PK, esc = PK.esc;
    function $(id) { return document.getElementById(id); }
    PK.initShell();
    var state = { q: new URLSearchParams(location.search).get('q') || '', bidang: '', page: 1 };
    $('fQ').value = state.q;

    var TAB = 'inline-flex h-10 shrink-0 items-center whitespace-nowrap rounded-full border px-4 text-sm font-medium transition-colors ';
    function renderTabs(fields) {
      var keys = [''].concat(fields);
      $('fieldTabs').innerHTML = keys.map(function (k) {
        var on = state.bidang === k;
        return '<button type="button" role="radio" aria-checked="' + on + '" data-field="' + esc(k) + '" class="' + TAB + (on ? 'border-transparent bg-white text-primary-700' : 'border-white/30 bg-white/10 text-white backdrop-blur-md hover:bg-white/20') + '">' + (k ? esc(k) : 'Semua bidang') + '</button>';
      }).join('');
    }
    function card(c) {
      return '<a href="perusahaan-detail.html?slug=' + encodeURIComponent(c.slug) + '" class="group flex items-center gap-4 rounded-2xl border border-border/70 bg-white p-5 transition hover:-translate-y-0.5 hover:border-primary-200 hover:shadow-card-lg">' +
        PK.logo({ company: c.name, field: c.field }, 'h-14 w-14 text-base !rounded-2xl') +
        '<div class="min-w-0 flex-1"><p class="line-clamp-2 text-base font-semibold leading-snug text-slate-900">' + esc(c.name) + '</p>' +
        '<p class="mt-1 flex items-center gap-1 text-xs text-slate-500">' + PK.icon('map-pin', 'h-3.5 w-3.5 shrink-0') + '<span class="truncate">' + esc(c.city) + '</span></p>' +
        '<span class="mt-2 inline-flex max-w-full items-center truncate rounded-full border border-slate-900/10 px-2.5 py-0.5 text-xs text-slate-600">' + esc(c.field) + '</span></div>' +
        '<span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-primary-50 text-primary-600 transition-colors group-hover:bg-primary-600 group-hover:text-white">' + PK.icon('arrow-right', 'h-4 w-4') + '</span></a>';
    }
    function load() {
      PK.api.listCompanies({ q: state.q, bidang: state.bidang, page: state.page, pageSize: 12 }).then(function (res) {
        $('list').innerHTML = res.items.length ? res.items.map(card).join('') :
          '<div class="col-span-full rounded-2xl border border-dashed border-border bg-white px-6 py-14 text-center"><p class="text-sm font-semibold text-slate-900">Perusahaan tidak ditemukan</p><p class="mt-1 text-sm text-slate-500">Coba kata kunci lain.</p></div>';
        $('lead').textContent = res.total + ' perusahaan mitra KarirLink.';
        $('pager').hidden = res.pages <= 1;
        PK.pager($('pager'), res, 'perusahaan');
      });
    }
    $('pager').addEventListener('pagination:change', function (e) { state.page = e.detail.page; window.scrollTo({ top: 0, behavior: 'smooth' }); load(); });
    var later = PK.debounce(function () { state.page = 1; load(); }, 300);
    $('fQ').addEventListener('input', function () { state.q = this.value; later(); });
    $('fieldTabs').addEventListener('click', function (e) {
      var b = e.target.closest('[data-field]'); if (!b) return;
      state.bidang = b.getAttribute('data-field'); state.page = 1; renderTabs(fields); load();
    });
    var fields = [];
    PK.api.facets().then(function (r) { fields = Object.keys(r.fields); renderTabs(fields); });
    load();
  })();
</script>
</body>
</html>
