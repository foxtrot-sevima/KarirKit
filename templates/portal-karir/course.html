<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Course | Portal Karir KarirLink</title>
<link rel="icon" type="image/svg+xml" href="../../assets/logo/karirlink-mark.svg" />
<link rel="stylesheet" href="../../dist/output.css" />
<meta name="description" content="Detail course gratis bersertifikat dari pusat karier kampus: kurikulum, progres belajar, dan sertifikat penyelesaian." />
<meta name="author" content="SEVIMA" />
<link rel="canonical" href="https://karirkit.vercel.app/templates/portal-karir/course.html" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#2361e7" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="KarirKit" />
<meta property="og:title" content="Course | Portal Karir KarirLink" />
<meta property="og:description" content="Course gratis bersertifikat dari pusat karier kampus." />
<meta property="og:url" content="https://karirkit.vercel.app/templates/portal-karir/course.html" />
<meta property="og:image" content="https://karirkit.vercel.app/assets/social/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:locale" content="id_ID" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Course | Portal Karir KarirLink" />
<meta name="twitter:description" content="Course gratis bersertifikat dari pusat karier kampus." />
<meta name="twitter:image" content="https://karirkit.vercel.app/assets/social/og-image.png" />
</head>
<body class="flex min-h-screen flex-col bg-shell font-sans text-slate-800 antialiased">

<!-- ============================= NAVBAR ============================= -->
<div data-shell="nav" data-page="grow"></div>

<main class="flex-1">
  <div class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 sm:py-8">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <span class="breadcrumb-item"><a href="pengembangan.html" class="breadcrumb-link"><i class="kk kk-compass h-4 w-4" aria-hidden="true"></i>Pengembangan Diri</a></span>
      <span class="breadcrumb-separator"><i class="kk kk-caret-right h-3 w-3" aria-hidden="true"></i></span>
      <span id="crumbTitle" class="breadcrumb-current min-w-0 truncate" aria-current="page">Course</span>
    </nav>

    <!-- ============================= DETAIL / BELAJAR ============================= -->
    <div class="mt-4 grid grid-cols-1 gap-6 lg:grid-cols-3 lg:items-start">
      <div id="detailMain" class="min-w-0 space-y-6 lg:col-span-2"><div class="h-96 animate-pulse rounded-card bg-neutral-100"></div></div>
      <aside id="detailSide" class="min-w-0 space-y-6 lg:sticky lg:top-20" aria-label="Ringkasan course"><div class="h-72 animate-pulse rounded-card bg-neutral-100"></div></aside>
    </div>
    <section id="similar" class="mt-10" hidden>
      <h2 class="font-display text-xl font-bold text-fg">Course lainnya</h2>
      <div id="similarGrid" class="mt-4 grid grid-cols-1 gap-5 md:grid-cols-3"></div>
    </section>
  </div>
</main>

<div data-shell="footer"></div>

<!-- ============================= SERTIFIKAT ============================= -->
<div class="modal-backdrop z-[60]" id="certModal">
  <div class="modal-panel modal-xl">
    <div class="modal-header">
      <div><h3 class="modal-title">Sertifikat penyelesaian</h3><p class="modal-description">Tampil di profilmu setelah ditambahkan.</p></div>
      <button type="button" class="modal-close" data-modal-hide="certModal" aria-label="Tutup"><i class="kk kk-x h-4 w-4"></i></button>
    </div>
    <div class="modal-body"><div id="certBody"></div></div>
    <div class="modal-footer"><div class="flex w-full justify-end gap-2"><button type="button" class="btn-outline btn-md" data-toast="Sertifikat diunduh sebagai PDF.">Unduh PDF</button><button type="button" class="btn-primary btn-md" data-toast="Sertifikat ditambahkan ke profilmu.">Tambahkan ke profil</button></div></div>
  </div>
</div>

<script src="../../assets/js/ui.js"></script>
<script src="../../assets/js/drawer.js"></script>
<script src="../../assets/js/modal.js"></script>
<script src="../../assets/js/toast.js"></script>
<script src="shell.js"></script>
<script src="portal.js"></script>
<script>
  /* Detail dan belajar satu course: kurikulum sebelum mendaftar, lalu pemutar materi dengan progres, dan sertifikat saat selesai.
     Alamat: course.html?id=ID. Data lewat PK.api (getCourse, enrollCourse, setLesson). Daftar course ada di pengembangan.html. */
  (function () {
    var PK = window.PK, api = PK.api, esc = PK.esc, ic = PK.icon, cardSection = PK.cardSection;
    function $(id) { return document.getElementById(id); }
    PK.initShell();

    var courseId = parseInt(new URLSearchParams(location.search).get('id'), 10);
    if (!courseId) { location.replace('pengembangan.html'); return; }
    var cur = null, lessonIdx = 0, token = PK.latest();
    function toTop() { window.scrollTo({ top: 0 }); }

    function flat() { return PK.lessonsOf(cur.course); }
    function curriculum(c, p, interactive) {
      var n = -1;
      return c.modules.map(function (m, mi) {
        return '<div class="border-t border-border first:border-t-0"><p class="bg-neutral-50 px-5 py-2.5 text-xs font-semibold uppercase tracking-wider text-fg-muted">Modul ' + (mi + 1) + ': ' + esc(m.title) + '</p><ul class="list-group list-group-flush !border-0">' +
          m.lessons.map(function (l) {
            n++;
            var done = p.done.indexOf(n) !== -1, on = interactive && n === lessonIdx;
            var inner = '<span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full ' + (done ? 'bg-success-600 text-white' : on ? 'bg-primary-100 text-primary-700' : 'bg-neutral-100 text-neutral-400') + '">' + ic(done ? 'check' : on ? 'caret-right' : 'dots-three', 'h-3 w-3') + '</span><span class="min-w-0 flex-1 truncate">' + esc(l.t) + '</span><span class="text-xs font-normal text-fg-muted">' + l.min + ' mnt</span>';
            return interactive ? '<li><button type="button" class="list-group-item list-group-item-action ' + (on ? 'is-active' : '') + ' !px-5 !py-3 font-normal" data-lesson="' + n + '">' + inner + '</button></li>' : '<li class="list-group-item !px-5 !py-3 font-normal">' + inner + '</li>';
          }).join('') + '</ul></div>';
      }).join('');
    }

    function renderDetail() {
      var c = cur.course, p = cur.progress, t = PK.TINT_OF(c.cat), lessons = flat(), n = lessons.length;
      $('crumbTitle').textContent = c.title; document.title = c.title + ' | Pengembangan Diri KarirLink';
      if (!p.enrolled) {
        $('detailMain').innerHTML =
          '<section class="card overflow-hidden"><div class="p-2"><div class="rounded-xl p-6 sm:p-8 ' + t.soft + '"><div class="flex flex-wrap gap-2"><span class="inline-flex rounded-full bg-white px-3 py-1 text-xs font-semibold ' + t.text + '">' + esc(c.cat) + '</span><span class="inline-flex rounded-full bg-white px-3 py-1 text-xs font-medium text-slate-700">' + esc(c.level) + '</span></div>' +
          '<h1 class="mt-4 font-display text-2xl font-bold text-fg sm:text-3xl">' + esc(c.title) + '</h1><p class="card-text mt-3 leading-relaxed">' + esc(c.desc) + '</p>' +
          '<div class="mt-5 flex items-center gap-3"><span class="avatar h-10 w-10 text-sm">' + esc(PK.initials(c.instructor)) + '</span><span><span class="block text-sm font-semibold text-fg">' + esc(c.instructor) + '</span><span class="block text-xs text-fg-muted">' + esc(c.role) + '</span></span></div></div></div></section>' +
          cardSection('Yang akan kamu pelajari', '<ul class="grid gap-3 px-6 pb-6 sm:grid-cols-2">' + c.learn.map(function (x) { return '<li class="flex items-start gap-2.5 text-sm text-fg-muted">' + ic('check-circle', 'kk-fill mt-0.5 h-4 w-4 shrink-0 text-primary-500') + '<span>' + esc(x) + '</span></li>'; }).join('') + '</ul>') +
          cardSection('Kurikulum', curriculum(c, p, false), '<span class="badge-neutral">' + n + ' materi</span>');
        $('detailSide').innerHTML = '<section class="card card-body"><p class="font-display text-2xl font-bold text-fg">Gratis</p><ul class="mt-4 space-y-3 text-sm text-fg-muted"><li class="flex items-center gap-2.5">' + ic('clock', 'h-4 w-4') + PK.courseDuration(c) + ' total</li><li class="flex items-center gap-2.5">' + ic('list-checks', 'h-4 w-4') + n + ' materi dalam ' + c.modules.length + ' modul</li><li class="flex items-center gap-2.5">' + ic('seal-check', 'h-4 w-4') + 'Sertifikat penyelesaian</li><li class="flex items-center gap-2.5">' + ic('users', 'h-4 w-4') + c.learners.toLocaleString('id-ID') + ' peserta</li></ul><button type="button" class="btn-primary btn-lg mt-5 w-full" data-enroll="' + c.id + '">' + ic('graduation-cap', 'h-4 w-4') + 'Daftar dan mulai belajar</button><button type="button" class="btn-ghost btn-sm mt-2 w-full" data-share>' + ic('share-network', 'h-4 w-4') + 'Salin tautan course</button></section>';
      } else {
        if (lessonIdx >= n) lessonIdx = n - 1;
        var l = lessons[lessonIdx], done = p.done.indexOf(lessonIdx) !== -1;
        $('detailMain').innerHTML =
          '<section class="card overflow-hidden"><div class="relative flex aspect-video items-center justify-center bg-gradient-to-br from-primary-900 via-primary-800 to-primary-600"><div aria-hidden="true" class="absolute inset-0 opacity-30" style="background-image: radial-gradient(rgba(255,255,255,0.4) 1px, transparent 1px); background-size: 22px 22px;"></div><span class="relative flex h-16 w-16 items-center justify-center rounded-full bg-white/90 text-primary-700 shadow-xl">' + ic('play', 'kk-fill h-7 w-7') + '</span><span class="absolute bottom-3 left-4 rounded-full bg-black/40 px-3 py-1 text-xs text-white backdrop-blur">Materi ' + (lessonIdx + 1) + ' dari ' + n + ' &middot; ' + l.min + ' menit</span></div>' +
          '<div class="card-body"><p class="text-xs font-semibold uppercase tracking-wider text-primary-600">Modul ' + (l.mi + 1) + ': ' + esc(c.modules[l.mi].title) + '</p><h1 class="mt-1 font-display text-xl font-bold text-fg sm:text-2xl">' + esc(l.t) + '</h1><p class="card-text mt-3 leading-relaxed">Pemutar video dan bahan bacaan materi ini akan tampil di sini. Setelah selesai mempelajarinya, tandai materi sebagai selesai agar progresmu tersimpan.</p>' +
          '<div class="mt-6 flex flex-wrap items-center justify-between gap-3"><div class="flex gap-2"><button type="button" class="btn-outline btn-md" data-step="-1"' + (lessonIdx === 0 ? ' disabled' : '') + '>' + ic('arrow-left', 'h-4 w-4') + 'Sebelumnya</button><button type="button" class="btn-outline btn-md" data-step="1"' + (lessonIdx === n - 1 ? ' disabled' : '') + '>Berikutnya' + ic('arrow-right', 'h-4 w-4') + '</button></div>' +
          '<button type="button" class="btn-' + (done ? 'secondary' : 'primary') + ' btn-md" data-toggle="' + lessonIdx + '">' + ic('check', 'h-4 w-4') + (done ? 'Selesai, batalkan' : 'Tandai selesai') + '</button></div></div></section>' +
          cardSection('Tentang course', '<p class="card-text px-6 pb-6 leading-relaxed">' + esc(c.desc) + '</p>');
        $('detailSide').innerHTML =
          '<section class="card card-body"><div class="flex items-center justify-between"><h2 class="card-title !text-base">Progres belajar</h2><span class="badge-' + (p.complete ? 'success' : 'primary') + '">' + p.pct + '%</span></div><div class="progress-track mt-3 h-2"><div class="progress-bar" style="width: ' + p.pct + '%"></div></div><p class="card-text mt-2 text-xs">' + p.done.length + ' dari ' + n + ' materi selesai</p>' +
          (p.complete ? '<div class="callout-success mt-4"><p class="flex items-center gap-2 text-sm font-semibold text-fg">' + ic('seal-check', 'kk-fill h-4 w-4 text-success-600') + 'Selamat, course selesai</p><button type="button" class="btn-primary btn-sm mt-3 w-full" data-cert>Lihat sertifikat</button></div>' : '') + '</section>' +
          cardSection('Daftar materi', curriculum(c, p, true));
      }
      $('similar').hidden = !cur.similar.length;
      $('similarGrid').innerHTML = cur.similar.map(function (x) { return PK.courseCard({ course: x }); }).join('');
    }
    function loadDetail(keepIdx) {
      $('detailMain').innerHTML = '<div class="h-96 animate-pulse rounded-card bg-neutral-100"></div>'; $('detailSide').innerHTML = '<div class="h-72 animate-pulse rounded-card bg-neutral-100"></div>'; $('similar').hidden = true;
      var ok = token();
      api.getCourse(courseId).then(function (res) {
        if (!ok()) return;
        cur = res;
        if (!keepIdx) { lessonIdx = res.progress.enrolled ? Math.min(Math.max(0, flat().findIndex(function (_, i) { return res.progress.done.indexOf(i) === -1; })), flat().length - 1) : 0; if (res.progress.complete) lessonIdx = 0; }
        renderDetail(); if (!keepIdx) toTop();
      }).catch(function (err) { if (!ok()) return; $('detailSide').innerHTML = ''; $('detailMain').innerHTML = PK.errorBox(err.message).replace('data-retry', 'data-retry-detail'); });
    }
    function showCert() {
      var c = cur.course;
      $('certBody').innerHTML = '<div class="rounded-card border-4 border-double border-primary-200 bg-gradient-to-br from-primary-50 via-white to-secondary-50 p-8 text-center sm:p-12"><img src="../../assets/logo/karirlink-sevima.svg" alt="KarirLink SEVIMA" class="mx-auto h-9 w-auto" /><p class="mt-6 text-xs font-semibold uppercase tracking-[0.3em] text-primary-600">Sertifikat Penyelesaian</p><p class="mt-5 text-sm text-fg-muted">Diberikan kepada</p><p class="mt-1 font-display text-3xl font-bold text-fg">' + esc(PK.user.name || 'Peserta') + '</p><p class="mt-5 text-sm text-fg-muted">atas penyelesaian course</p><p class="mt-1 font-display text-xl font-semibold text-primary-700">' + esc(c.title) + '</p><p class="mt-6 text-xs text-fg-subtle">' + esc(PK.CAMPUS.name) + ' &middot; ' + new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) + '</p></div>';
      KKModal.open('certModal');
    }

    document.addEventListener('click', function (e) {
      if (e.target.closest('[data-retry-detail]')) { loadDetail(); return; }
      var en = e.target.closest('[data-enroll]');
      if (en) { en.disabled = true; en.classList.add('btn-loading'); api.enrollCourse(courseId).then(function () { PK.toast('success', 'Kamu terdaftar. Selamat belajar!'); loadDetail(); }); return; }
      var ls = e.target.closest('[data-lesson]');
      if (ls) { lessonIdx = parseInt(ls.getAttribute('data-lesson'), 10); renderDetail(); return; }
      var sp = e.target.closest('[data-step]');
      if (sp) { lessonIdx += parseInt(sp.getAttribute('data-step'), 10); renderDetail(); return; }
      var tg = e.target.closest('[data-toggle]');
      if (tg) {
        var i = parseInt(tg.getAttribute('data-toggle'), 10), was = cur.progress.done.indexOf(i) !== -1;
        api.setLesson(courseId, i, !was).then(function (r) {
          cur.progress = r.progress;
          if (!was && !r.progress.complete && i < flat().length - 1) lessonIdx = i + 1;
          renderDetail();
          if (r.progress.complete && !was) PK.toast('success', 'Selamat, kamu menyelesaikan course ini.');
        });
        return;
      }
      if (e.target.closest('[data-cert]')) { showCert(); return; }
      var tt = e.target.closest('[data-toast]');
      if (tt) { PK.toast('success', tt.getAttribute('data-toast')); return; }
      if (e.target.closest('[data-share]')) { var url = location.href.split('?')[0] + '?id=' + courseId, done = function () { PK.toast('success', 'Tautan course disalin.'); }; try { navigator.clipboard.writeText(url).then(done, done); } catch (err) { done(); } }
    });

    loadDetail();
  })();
</script>
</body>
</html>
