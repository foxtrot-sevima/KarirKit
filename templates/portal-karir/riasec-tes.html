<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mengerjakan Tes Minat Karier RIASEC | Portal Karir KarirLink</title>
<link rel="icon" type="image/svg+xml" href="../../assets/logo/karirlink-mark.svg" />
<link rel="stylesheet" href="../../dist/output.css" />
<script src="../campus-theme.js"></script>
<meta name="description" content="Kerjakan Tes Minat Karier RIASEC: 30 pernyataan singkat untuk mengenali tipe minat kariermu." />
<meta name="author" content="SEVIMA" />
<link rel="canonical" href="https://karirkit.vercel.app/templates/portal-karir/riasec-tes.html" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#2361e7" />
<style>
  @keyframes q-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .q-in { animation: q-in .24s ease-out; }
  @media (prefers-reduced-motion: reduce) { .q-in { animation: none; } }
</style>
</head>
<body class="font-sans text-slate-800 antialiased">

<!-- Layar pengerjaan: satu kolom penuh tanpa navbar dan footer (fokus), pola yang sama dengan onboarding.html.
     Kerangka statis; script hanya mengisi progres, pertanyaan, dan keadaan tombol. -->
<div class="relative flex min-h-screen flex-col overflow-hidden bg-gradient-to-b from-primary-50/80 via-white to-white">
  <div id="glow" aria-hidden="true" class="pointer-events-none absolute -right-24 -top-24 h-96 w-96 rounded-full bg-primary-200/50 blur-3xl transition-colors duration-500"></div>
  <div aria-hidden="true" class="pointer-events-none absolute -bottom-32 -left-24 h-96 w-96 rounded-full bg-secondary-200/40 blur-3xl"></div>

  <header class="sticky top-0 z-20 bg-white/70 px-6 pb-4 pt-6 backdrop-blur-md sm:px-12">
    <div class="mx-auto w-full max-w-2xl">
      <div class="flex items-center justify-between gap-4">
        <a href="riasec.html" aria-label="Keluar dari tes"><img src="../../assets/logo/karirlink-sevima.svg" alt="KarirLink SEVIMA" class="h-9 w-auto" /></a>
        <button type="button" id="exitBtn" class="btn-ghost btn-sm">Simpan dan keluar</button>
      </div>
      <div class="mt-5 flex items-center gap-3">
        <div id="segs" class="flex flex-1 gap-1.5" role="progressbar" aria-label="Kemajuan tes" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0"></div>
        <span id="count" class="shrink-0 text-xs font-semibold text-fg">0<span class="font-normal text-fg-muted"> / 30</span></span>
      </div>
    </div>
  </header>

  <main class="relative flex flex-1 flex-col px-6 py-8 sm:px-12">
    <div class="mx-auto my-auto w-full max-w-2xl">
      <!-- pernyataan aktif (diisi script) -->
      <section id="question" aria-labelledby="runTitle"><div class="h-72 animate-pulse rounded-card bg-neutral-100"></div></section>
    </div>
  </main>

  <div class="sticky bottom-0 z-10 border-t border-border bg-white/80 px-6 py-4 backdrop-blur-md sm:px-12">
    <div class="mx-auto flex w-full max-w-2xl items-center justify-between gap-3">
      <button type="button" id="prevBtn" class="btn-outline btn-md" hidden><i class="kk kk-arrow-left h-4 w-4" aria-hidden="true"></i><span class="hidden min-[380px]:inline">Kembali</span></button>
      <span></span>
      <button type="button" id="demoBtn" class="btn-ghost btn-md" hidden>Isi otomatis</button>
      <button type="button" id="nextBtn" class="btn-primary btn-md" disabled><span>Lanjut</span><i class="kk kk-arrow-right h-4 w-4" aria-hidden="true"></i></button>
      <button type="button" id="finishBtn" class="btn-primary btn-md" hidden><span>Lihat hasilku</span><i class="kk kk-sparkle h-4 w-4" aria-hidden="true"></i></button>
    </div>
  </div>
</div>

<script src="../../assets/js/ui.js"></script>
<script src="../../assets/js/toast.js"></script>
<script src="portal.js"></script>
<script>
  /* Pengerjaan Tes Minat Karier RIASEC: satu pernyataan per layar, jawaban otomatis lanjut, draf tersimpan di setiap jawaban.
     Alamat: riasec-tes.html (lanjutkan draf atau mulai), riasec-tes.html?baru=1 (mulai dari awal), tambahkan &demo=1 untuk tombol isi otomatis.
     Selesai membuka riasec-hasil.html; keluar membuka riasec.html (detail tes). */
  (function () {
    var PK = window.PK, api = PK.api, esc = PK.esc, ic = PK.icon, PER = 5, SECTIONS = 6;
    var QS = PK.RIASEC_QS, SCALE = PK.RIASEC_SCALE, RI = PK.RIASEC, TINT = PK.TINT;
    function $(id) { return document.getElementById(id); }
    var qs = new URLSearchParams(location.search), demo = qs.get('demo') === '1';
    var run = null, animateNext = false;

    // Skala 1-5 dari tidak suka ke sangat suka. Di ponsel tampil sebagai daftar (sangat suka di atas), di layar lebar sebagai lima kartu sejajar.
    var CHOICES = [[1, 'thumbs-down', 'danger'], [2, 'smiley-sad', 'warning'], [3, 'smiley-meh', 'neutral'], [4, 'smiley', 'info'], [5, 'heart', 'success']];
    var CHOICE_TILE = { success: 'bg-success-50 text-success-600 group-has-checked/c:bg-success-600 group-has-checked/c:text-white', info: 'bg-info-50 text-info-600 group-has-checked/c:bg-info-600 group-has-checked/c:text-white', neutral: 'bg-neutral-100 text-neutral-600 group-has-checked/c:bg-neutral-600 group-has-checked/c:text-white', warning: 'bg-warning-50 text-warning-600 group-has-checked/c:bg-warning-600 group-has-checked/c:text-white', danger: 'bg-danger-50 text-danger-600 group-has-checked/c:bg-danger-600 group-has-checked/c:text-white' };
    var GLOW = { warning: 'bg-warning-200/50', info: 'bg-info-200/50', secondary: 'bg-secondary-200/50', success: 'bg-success-200/50', danger: 'bg-danger-200/50', primary: 'bg-primary-200/50' };
    var SEC_TITLE = ['Pemanasan', 'Mulai seru', 'Separuh jalan', 'Terus lanjut', 'Hampir sampai', 'Tahap akhir'];

    function persist() { run.updatedAt = Date.now(); api.saveDraft('riasec', run); }
    function missing() { return run.answers.filter(function (v) { return !v; }).length; }

    function render() {
      var fresh = animateNext; animateNext = false;
      var total = QS.length, i = run.idx, v = run.answers[i], left = missing(), answered = total - left, last = i === total - 1, sec = Math.floor(i / PER);
      var type = RI[QS[i].type], q = QS[i].text; q = q.charAt(0).toLowerCase() + q.slice(1);

      // progres (statis di HTML, diisi di sini)
      var segs = ''; for (var k = 0; k < SECTIONS; k++) segs += '<span class="h-2 flex-1 rounded-full transition-colors ' + (k < sec ? 'bg-primary-600' : k === sec ? 'bg-primary-300' : 'bg-neutral-200') + '"></span>';
      $('segs').innerHTML = segs; $('segs').setAttribute('aria-valuenow', answered);
      $('count').innerHTML = answered + '<span class="font-normal text-fg-muted"> / ' + total + '</span>';
      $('glow').className = 'pointer-events-none absolute -right-24 -top-24 h-96 w-96 rounded-full blur-3xl transition-colors duration-500 ' + GLOW[type.tone];

      // pernyataan
      var choices = CHOICES.map(function (c) {
        return '<label class="choice group/c"><input type="radio" name="ans" value="' + c[0] + '"' + (v === c[0] ? ' checked' : '') + ' data-ans="' + c[0] + '" /><span class="choice-body flex-row items-center gap-3 py-3 pr-10 sm:flex-col sm:gap-2.5 sm:px-2 sm:py-5 sm:pr-2 sm:text-center"><span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl transition-colors sm:h-12 sm:w-12 ' + CHOICE_TILE[c[2]] + '">' + ic(c[1], 'h-5 w-5 sm:h-6 sm:w-6') + '</span><span class="choice-title sm:text-xs">' + SCALE[c[0] - 1] + '</span></span><span class="absolute right-3 top-1/2 flex h-5 w-5 -translate-y-1/2 items-center justify-center rounded-full bg-primary-600 text-white opacity-0 transition-opacity group-has-checked/c:opacity-100 sm:right-2 sm:top-2 sm:h-4 sm:w-4 sm:translate-y-0" aria-hidden="true">' + ic('check', 'h-3 w-3') + '</span></label>';
      }).join('');
      var banner = fresh && i > 0 && i % PER === 0 ? '<div class="callout-success mb-6 flex items-center gap-2.5 py-2.5">' + ic('seal-check', 'kk-fill h-5 w-5 shrink-0 text-success-600') + '<p class="text-sm font-medium text-fg">Bagian ' + sec + ' selesai. Lanjut ke bagian ' + (sec + 1) + '.</p></div>' : '';
      var qEl = $('question');
      qEl.className = fresh ? 'q-in' : '';
      qEl.innerHTML = banner +
        '<div class="flex items-center gap-3"><span class="flex h-14 w-14 items-center justify-center rounded-2xl shadow-sm ' + TINT[type.tone].logo + '">' + ic(type.icon, 'h-7 w-7') + '</span><div><p class="text-xs font-semibold uppercase tracking-wider text-primary-600">Bagian ' + (sec + 1) + ' dari ' + SECTIONS + '</p><p class="text-sm text-fg-muted">' + SEC_TITLE[sec] + ' &middot; pernyataan ' + (i + 1) + '</p></div></div>' +
        '<h1 id="runTitle" tabindex="-1" class="mt-5 font-display text-2xl font-bold leading-snug text-slate-900 outline-none sm:text-3xl">Seberapa kamu suka ' + esc(q) + '?</h1>' +
        '<p class="mt-2 text-sm text-slate-500 sm:text-base">Pilih yang paling menggambarkan perasaanmu. Tidak ada jawaban benar atau salah.</p>' +
        '<fieldset class="mt-8"><legend class="sr-only">Jawaban</legend><div class="flex flex-col-reverse gap-3 sm:grid sm:grid-cols-5">' + choices + '</div></fieldset>' +
        (last && left ? '<p class="form-error mt-4">Masih ada ' + left + ' pernyataan yang belum dijawab. <button type="button" class="font-semibold underline" data-goto="' + run.answers.indexOf(0) + '">Ke yang belum dijawab</button></p>' : '');
      if (fresh) $('runTitle').focus({ preventScroll: true });

      // tombol
      $('prevBtn').hidden = i === 0;
      $('nextBtn').hidden = last; $('nextBtn').disabled = !v;
      $('finishBtn').hidden = !last; $('finishBtn').disabled = left > 0;
      $('demoBtn').hidden = !demo;
    }
    function goTo(i) { run.idx = Math.max(0, Math.min(QS.length - 1, i)); persist(); animateNext = true; render(); window.scrollTo({ top: 0 }); }
    function answer(i, v) {
      run.answers[i] = v; persist(); render();
      // lanjut otomatis setelah jeda singkat, kecuali di pernyataan terakhir
      if (i < QS.length - 1) setTimeout(function () { if (run.idx === i) goTo(i + 1); }, 280);
    }
    function finish() {
      var btn = $('finishBtn'); btn.disabled = true; btn.classList.add('btn-loading');
      api.submitTest('riasec', run.answers.slice(), run.startedAt).then(function (r) {
        location.href = 'riasec-hasil.html?id=' + r.attempt.id;
      }).catch(function (err) { btn.disabled = false; btn.classList.remove('btn-loading'); PK.toast('error', err.message || 'Hasil belum bisa disimpan, coba lagi.'); });
    }

    // ---- interaksi
    document.addEventListener('change', function (e) { var r = e.target.closest('input[data-ans]'); if (r && run) answer(run.idx, parseInt(r.getAttribute('data-ans'), 10)); });
    document.addEventListener('click', function (e) {
      if (e.target.closest('[data-retry]')) { location.reload(); return; }
      var g = e.target.closest('[data-goto]'); if (g && run) goTo(parseInt(g.getAttribute('data-goto'), 10));
    });
    $('prevBtn').addEventListener('click', function () { goTo(run.idx - 1); });
    $('nextBtn').addEventListener('click', function () { goTo(run.idx + 1); });
    $('finishBtn').addEventListener('click', finish);
    $('exitBtn').addEventListener('click', function () { persist(); location.href = 'riasec.html'; });
    $('demoBtn').addEventListener('click', function () {
      QS.forEach(function (q, i) { var hi = q.type === 'I' || q.type === 'A' || q.type === 'S'; run.answers[i] = hi ? 4 + (i % 2) : q.type === 'E' ? 3 : 1 + (i % 2); });
      goTo(QS.length - 1);
    });
    // Pintasan keyboard: 1 sampai 5 menjawab, panah kiri dan kanan berpindah pernyataan.
    document.addEventListener('keydown', function (e) {
      if (!run || e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || '')) return;
      if (/^[1-5]$/.test(e.key)) { answer(run.idx, parseInt(e.key, 10)); e.preventDefault(); }
      else if (e.key === 'ArrowRight' && run.answers[run.idx] && run.idx < QS.length - 1) goTo(run.idx + 1);
      else if (e.key === 'ArrowLeft' && run.idx > 0) goTo(run.idx - 1);
    });

    // ---- mulai: lanjutkan draf, atau buat baru bila diminta (?baru=1) atau belum ada
    api.getTest('riasec').then(function (res) {
      var d = res.state.draft;
      if (qs.get('baru') === '1' || !d || !d.answers) {
        d = { answers: QS.map(function () { return 0; }), idx: 0, startedAt: Date.now(), updatedAt: Date.now() };
        api.saveDraft('riasec', d);
        // muat ulang halaman tidak mengulang dari awal
        try { qs.delete('baru'); history.replaceState(null, '', qs.toString() ? '?' + qs : location.pathname); } catch (e) { /* file:// */ }
      }
      if (typeof d.idx !== 'number') { var f = d.answers.indexOf(0); d.idx = f === -1 ? QS.length - 1 : f; }
      run = d; render();
    }).catch(function (err) {
      $('question').innerHTML = PK.errorBox(err.message);
    });
  })();
</script>
</body>
</html>
