<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minta Link Aktivasi Baru | KarirLink</title>
<link rel="icon" type="image/svg+xml" href="../../assets/logo/karirlink-mark.svg" />
<link rel="stylesheet" href="../../dist/output.css" />
<script src="../campus-theme.js"></script>
<meta name="description" content="Minta link aktivasi akun KarirLink yang baru lewat email." />
<meta name="author" content="SEVIMA" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#2361e7" />
</head>
<body class="flex min-h-screen flex-col bg-shell font-sans text-slate-800 antialiased">

<main class="flex flex-1 items-center justify-center px-4 py-10 sm:py-16">
  <div class="w-full max-w-md">
    <a href="login.html" class="mb-8 flex justify-center" aria-label="KarirLink SEVIMA">
      <img src="../../assets/logo/karirlink-sevima.svg" alt="KarirLink SEVIMA" class="h-9 w-auto" />
    </a>

    <section class="card card-body sm:p-8">
      <div class="text-center">
      <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-primary-50 text-primary-600"><i class="kk kk-envelope-simple h-7 w-7" aria-hidden="true"></i></span>
        <h1 class="mt-5 font-display text-2xl font-bold text-slate-900">Minta link aktivasi baru</h1>
        <p class="mt-2 text-sm text-slate-500">Masukkan email yang terdaftar di kampus Anda. Link aktivasi baru dikirim bila email tersebut terdaftar.</p>
      </div>

      <form id="newLinkForm" class="mt-7 space-y-5" novalidate>
        <div>
          <label for="nlEmail" class="form-label">Alamat Email</label>
          <input id="nlEmail" name="email" type="email" required autocomplete="email" class="input" placeholder="nama@email.com" />
          <p class="form-error hidden" data-error-for="nlEmail">Masukkan alamat email yang valid.</p>
        </div>
        <button type="submit" class="btn-primary btn-lg w-full">Kirim link baru</button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500"><a href="login.html" class="font-semibold text-primary-600 hover:text-primary-700">Kembali ke halaman masuk</a></p>
    </section>

    <p class="mt-8 text-center text-xs text-fg-subtle">&copy; <span class="js-current-year">2026</span> SEVIMA. All Rights Reserved.</p>
  </div>
</main>

<script>
  // Pesan hasil sama untuk email terdaftar maupun tidak (tidak membocorkan siapa yang punya akun): selalu ke halaman yang sama.
  const form = document.getElementById('newLinkForm');
  const email = document.getElementById('nlEmail');
  const err = form.querySelector('[data-error-for="nlEmail"]');
  email.addEventListener('input', () => { email.setAttribute('aria-invalid', 'false'); err.classList.add('hidden'); });
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!email.checkValidity()) { email.setAttribute('aria-invalid', 'true'); err.classList.remove('hidden'); email.focus(); return; }
    window.location.href = 'link-baru-terkirim.html';
  });
  document.querySelectorAll('.js-current-year').forEach((el) => { el.textContent = new Date().getFullYear(); });
</script>
</body>
</html>
