<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Event | Portal Karir KarirLink</title>
<link rel="icon" type="image/svg+xml" href="../../../assets/logo/karirlink-mark.svg" />
<link rel="stylesheet" href="../../../dist/output.css" />
<meta name="description" content="Daftar event dan kegiatan pusat karier kampus: job fair, workshop, webinar, pelatihan, dan kegiatan kampus." />
<meta name="author" content="SEVIMA" />
<link rel="canonical" href="https://karirkit.vercel.app/templates/custom/portal-karir/event.html" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#2361e7" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="KarirKit" />
<meta property="og:title" content="Event | Portal Karir KarirLink" />
<meta property="og:description" content="Cari lowongan, magang, dan pekerjaan lepas di Portal Karir KarirLink. Bandingkan beberapa lowongan sekaligus dan lamar langsung dari halaman detail." />
<meta property="og:url" content="https://karirkit.vercel.app/templates/custom/portal-karir/event.html" />
<meta property="og:image" content="https://karirkit.vercel.app/assets/social/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:locale" content="id_ID" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Event | Portal Karir KarirLink" />
<meta name="twitter:description" content="Cari lowongan, magang, dan pekerjaan lepas di Portal Karir KarirLink. Bandingkan beberapa lowongan sekaligus dan lamar langsung dari halaman detail." />
<meta name="twitter:image" content="https://karirkit.vercel.app/assets/social/og-image.png" />
</head>
<body class="flex min-h-screen flex-col bg-shell font-sans text-slate-800 antialiased">

<!-- ============================= NAVBAR ============================= -->
<div data-shell="nav" data-page="event"></div>

<main class="flex-1">

  <!-- ============================= BAND JUDUL + PENCARIAN ============================= -->
  <section data-nav-hero class="relative bg-brand-gradient text-white">
    <div aria-hidden="true" class="pointer-events-none absolute inset-0 overflow-hidden">
      <div class="absolute inset-0 opacity-40" style="background-image: radial-gradient(rgba(255,255,255,0.35) 1px, transparent 1px); background-size: 22px 22px;"></div>
    </div>
    <div class="relative mx-auto w-full max-w-7xl px-4 pb-10 pt-24 sm:px-6">
      <h1 class="font-display text-2xl font-bold sm:text-3xl">Event dan kegiatan</h1>
      <p class="mt-1 max-w-2xl text-sm text-white/80">Job fair, workshop, webinar, pelatihan, dan kegiatan kampus untuk mahasiswa dan alumni.</p>
      <form id="filterForm" role="search" class="card mt-5 p-4" data-combo-boundary>
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-[1fr_13rem_13rem_auto] lg:items-end">
          <div class="sm:col-span-2 lg:col-span-1">
            <label for="fQ" class="form-label">Kata kunci</label>
            <div class="relative">
              <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-fg-subtle"><i class="kk kk-magnifying-glass h-4 w-4" aria-hidden="true"></i></span>
              <input id="fQ" type="search" class="input pl-9" placeholder="Cari nama event, lokasi, atau penyelenggara" autocomplete="off" />
            </div>
          </div>
          <div><p class="form-label">Kategori</p><div id="hCat"></div></div>
          <div><p class="form-label">Format</p><div id="hFormat"></div></div>
          <button type="submit" class="btn-primary btn-md sm:col-span-2 lg:col-span-1">Cari</button>
        </div>
      </form>
    </div>
  </section>

  <!-- ============================= DAFTAR EVENT ============================= -->
  <div class="mx-auto w-full max-w-7xl px-4 py-8 sm:px-6 sm:py-10">
    <div id="eventGrid" class="grid grid-cols-1 gap-5 md:grid-cols-2 lg:grid-cols-3" aria-live="polite"></div>
    <div id="pager" class="mt-8"></div>
  </div>
</main>

<div data-shell="footer"></div>

<script src="../../../assets/js/ui.js"></script>
<script src="../../../assets/js/drawer.js"></script>
<script src="../../../assets/js/pagination.js"></script>
<script src="../../../assets/js/toast.js"></script>
<script src="../../portal-karir/shell.js"></script>
<script src="campus.js"></script>
<script src="../../portal-karir/portal.js"></script>
<script>
  /* Halaman Event (daftar): kategori, format, pencarian, dan paginasi (semua filter di satu formulir). Data lewat PK.api.listEvents; semua pilihan tersimpan di URL.
     Detail satu event ada di event-detail.html. */
  (function () {
    var PK = window.PK;
    var api = PK.api;
    var esc = PK.esc;
    var PAGE_SIZE = 6;
    function $(id) { return document.getElementById(id); }
    PK.initShell();

    var params = new URLSearchParams(location.search);
    var state = { kategori: params.get('kategori') || '', format: params.get('format') || '', q: params.get('q') || '', page: parseInt(params.get('page'), 10) || 1 };
    var listToken = PK.latest();

    $('hCat').innerHTML = PK.comboHtml({ id: 'fCat', all: 'Semua kategori', label: 'Kategori', value: state.kategori, options: PK.EVENT_CATS.map(function (c) { return [c, c]; }) });
    $('hFormat').innerHTML = PK.comboHtml({ id: 'fFormat', all: 'Semua format', label: 'Format', value: state.format, options: [['Offline', 'Tatap muka'], ['Online', 'Online']] });
    PK.initCombos(document);
    $('fQ').value = state.q;

    function syncUrl() {
      var p = new URLSearchParams();
      if (state.kategori) p.set('kategori', state.kategori);
      if (state.format) p.set('format', state.format);
      if (state.q) p.set('q', state.q);
      if (state.page > 1) p.set('page', state.page);
      try { history.replaceState(null, '', p.toString() ? '?' + p : location.pathname); } catch (e) { /* file:// */ }
    }
    function loadList() {
      syncUrl();
      var grid = $('eventGrid');
      grid.setAttribute('aria-busy', 'true');
      grid.innerHTML = [1, 2, 3].map(function () { return '<div class="h-64 animate-pulse rounded-card bg-neutral-100"></div>'; }).join('');
      var ok = listToken();
      api.listEvents({ kategori: state.kategori, format: state.format, q: state.q, page: state.page, pageSize: PAGE_SIZE }).then(function (res) {
        if (!ok()) return;
        state.page = res.page; syncUrl();
        grid.innerHTML = res.items.length ? res.items.map(PK.eventCard).join('') : '<div class="col-span-full">' + PK.emptyBox('calendar', 'Belum ada event yang cocok', 'Coba ubah kategori, format, atau kata kunci.', '<button type="button" class="btn-outline btn-sm" data-reset>Hapus filter</button>') + '</div>';
        grid.removeAttribute('aria-busy');
        PK.pager($('pager'), res, 'event');
      }).catch(function (err) { if (!ok()) return; grid.innerHTML = '<div class="col-span-full">' + PK.errorBox(err.message) + '</div>'; grid.removeAttribute('aria-busy'); $('pager').innerHTML = ''; });
    }

    document.addEventListener('click', function (e) {
      if (e.target.closest('[data-reset]')) { state.kategori = state.format = state.q = ''; state.page = 1; $('fQ').value = ''; PK.comboSet($('fCat'), ''); PK.comboSet($('fFormat'), ''); loadList(); return; }
      if (e.target.closest('[data-retry]')) loadList();
    });
    $('pager').addEventListener('pagination:change', function (e) { state.page = e.detail.page; loadList(); $('eventGrid').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    $('filterForm').addEventListener('combo:change', function () { state.kategori = $('fCat').dataset.value; state.format = $('fFormat').dataset.value; state.page = 1; loadList(); });
    $('filterForm').addEventListener('submit', function (e) { e.preventDefault(); state.q = $('fQ').value; state.page = 1; loadList(); });
    $('fQ').addEventListener('input', PK.debounce(function () { state.q = $('fQ').value; state.page = 1; loadList(); }, 350));

    loadList();
  })();
</script>
</body>
</html>
